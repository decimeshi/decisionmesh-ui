name: E2E (Playwright)
# workflow_dispatch ONLY for now, deliberately. This stack has never actually
# been run — see e2e/README.md. Switch to `on: [push, pull_request]` per the
# brief's CI sketch once a manual run has gone green and you've fixed
# whatever the first few attempts surface.
on:
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      # See docker-compose.e2e.yml's networking note: the browser (this
      # runner) and the `app` container must resolve "mock-oidc" to the
      # same logical place for JWT issuer validation to match.
      - name: Add mock-oidc host entry
        run: echo "127.0.0.1 mock-oidc" | sudo tee -a /etc/hosts

      - name: Log in to GHCR (to pull the backend image)
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bring up the e2e stack
        run: docker compose -f e2e/docker-compose.e2e.yml up -d --wait

      - name: Stack status (always show, helps debugging a red run)
        if: always()
        run: docker compose -f e2e/docker-compose.e2e.yml ps

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

      - name: Backend logs (always show, on failure this is usually the answer)
        if: always()
        run: docker compose -f e2e/docker-compose.e2e.yml logs app --tail=300

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose -f e2e/docker-compose.e2e.yml down -v
