  <div id="root"></div>
  <script>
    // TEMPORARY diagnostic for the prod-only blank-page investigation — a plain
    // classic script so it always runs regardless of any ESM/module failure,
    // and writes visibly onto the page instead of console (which several
    // debugging passes on decimeshi.com showed zero output from, even for
    // real thrown errors — this is the only channel not already ruled out).
    (function () {
      function showDiag(msg) {
        var el = document.getElementById('__diag__');
        if (!el) {
          el = document.createElement('pre');
          el.id = '__diag__';
          el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:2147483647;background:#fee2e2;color:#7f1d1d;padding:12px;font:12px/1.4 monospace;white-space:pre-wrap;max-height:60vh;overflow:auto;border-bottom:2px solid #7f1d1d;margin:0;';
          document.body.appendChild(el);
        }
        el.textContent += msg + '\n\n';
      }
      window.addEventListener('error', function (e) {
        showDiag('[window.error] ' + e.message + '\n' + ((e.error && e.error.stack) || '(no stack)') + '\nsrc: ' + e.filename + ':' + e.lineno + ':' + e.colno);
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        showDiag('[unhandledrejection] ' + (r && (r.stack || r.message || String(r))));
      });
      document.addEventListener('securitypolicyviolation', function (e) {
        showDiag('[CSP] ' + e.violatedDirective + ' blocked ' + e.blockedURI);
      });
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && root.children.length === 0) {
          showDiag('[diag] 4s after load, #root is still empty (' + root.children.length + ' children). readyState=' + document.readyState + '. No error reported through window.error, unhandledrejection, or securitypolicyviolation.');
        }
      }, 4000);
      // window.__mark?.() from the module script silently no-ops if this
      // script hasn't defined __mark yet by the time the module runs — and
      // module scripts are deferred, so their relative order vs this classic
      // script isn't something to assume. Order-independent instead: the
      // module always pushes onto a plain array (creating it if needed),
      // and this polls that array so it works regardless of which runs first.
      window.__marks = window.__marks || [];
      var shown = 0;
      setInterval(function () {
        var marks = window.__marks;
        for (; shown < marks.length; shown++) {
          showDiag('[mark] ' + marks[shown]);
        }
      }, 200);
    })();
  </script>
